name: CI
run-name: ${{ github.event_name == 'pull_request_target' && format('HVO-PR-CI v1 pr={0} head={1} base={2} merge={3}', github.event.pull_request.number, github.event.pull_request.head.sha, github.event.pull_request.base.sha, github.event.pull_request.merge_commit_sha) || format('CI {0} {1} {2}', github.event_name, github.sha, inputs.profile || 'full') }}

on:
  push:
    branches: [ main ]
  # The immutable target workflow admits and plans before executing PR code.
  pull_request_target:
    branches: [ main ]
    types: [ready_for_review, synchronize, reopened]
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      profile:
        description: 'Full validation, or a measured selection on trusted main'
        type: choice
        default: full
        options: [full, jkbms, website, shared]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

env:
  CI_HEAD: ${{ github.event_name == 'pull_request_target' && github.event.pull_request.head.sha || github.sha }}
  CI_BASE: ${{ github.event_name == 'pull_request_target' && github.event.pull_request.base.sha || github.sha }}
  CI_MERGE: ${{ github.event_name == 'pull_request_target' && github.event.pull_request.merge_commit_sha || github.sha }}
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 1
  CI_COVERAGE: ${{ github.event_name != 'pull_request_target' }}

jobs:
  review-evidence:
    if: github.event_name == 'pull_request_target' && !github.event.pull_request.draft && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      eligible: ${{ steps.evidence.outputs.eligible }}
      merge: ${{ steps.evidence.outputs.merge }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      - name: Validate current-source independent review
        id: evidence
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
          EXPECTED_BASE: ${{ github.event.pull_request.base.sha }}
          EXPECTED_MERGE: ${{ github.event.pull_request.merge_commit_sha }}
        run: node tools/pr-process.mjs

  plan:
    needs: review-evidence
    if: ${{ !cancelled() && (github.event_name != 'pull_request_target' || (!github.event.pull_request.draft && github.run_attempt == 1 && needs.review-evidence.result == 'success' && needs.review-evidence.outputs.eligible == 'true')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      plan: ${{ steps.plan.outputs.plan }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event_name == 'pull_request_target' && github.event.pull_request.base.sha || github.sha }}
          path: trusted
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      # Git objects are data only. Never run candidate MSBuild in this job.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event_name == 'pull_request_target' && needs.review-evidence.outputs.merge || github.sha }}
          path: candidate
          fetch-depth: 2
          persist-credentials: false
      - name: Derive affected work from trusted base
        id: plan
        working-directory: candidate
        env:
          CI_TRIGGER: ${{ github.event_name == 'workflow_dispatch' && inputs.profile != 'full' && 'benchmark' || github.event_name }}
          CI_BENCHMARK: ${{ github.event_name == 'workflow_dispatch' && inputs.profile != 'full' && inputs.profile || '' }}
          CI_FULL: ${{ contains(github.event.pull_request.labels.*.name, 'ci:full') }}
          CI_PLAN_PATH: ${{ github.workspace }}/ci-plan.json
        run: node ../trusted/tools/ci-source.mjs
      - name: Retain immutable plan
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ci-plan-${{ github.run_id }}
          path: ci-plan.json
          retention-days: 14

  validation:
    needs: plan
    if: ${{ !cancelled() && needs.plan.result == 'success' && (true) }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CI_PLAN: ${{ needs.plan.outputs.plan }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event_name == 'pull_request_target' && github.event.pull_request.base.sha || github.sha }}
          path: trusted
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ fromJSON(needs.plan.outputs.plan).source.merge }}
          path: candidate
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: candidate/global.json
      - name: Run planned validation work
        working-directory: candidate
        run: node ../trusted/tools/ci-run.mjs validation
      - name: Retain validation results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: test-results-validation-${{ github.run_id }}
          path: candidate/TestResults/**
          retention-days: 7

  home-assistant:
    needs: plan
    if: ${{ !cancelled() && needs.plan.result == 'success' && (toJSON(fromJSON(needs.plan.outputs.plan).lanes['home-assistant']) != '[]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CI_PLAN: ${{ needs.plan.outputs.plan }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event_name == 'pull_request_target' && github.event.pull_request.base.sha || github.sha }}
          path: trusted
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ fromJSON(needs.plan.outputs.plan).source.merge }}
          path: candidate
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: candidate/global.json
      - name: Run planned home-assistant work
        working-directory: candidate
        run: node ../trusted/tools/ci-run.mjs home-assistant
      - name: Retain home-assistant results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: test-results-home-assistant-${{ github.run_id }}
          path: candidate/TestResults/**
          retention-days: 7

  sql-server:
    needs: plan
    if: ${{ !cancelled() && needs.plan.result == 'success' && (toJSON(fromJSON(needs.plan.outputs.plan).lanes['sql-server']) != '[]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CI_PLAN: ${{ needs.plan.outputs.plan }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event_name == 'pull_request_target' && github.event.pull_request.base.sha || github.sha }}
          path: trusted
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ fromJSON(needs.plan.outputs.plan).source.merge }}
          path: candidate
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: candidate/global.json
      - name: Run planned sql-server work
        working-directory: candidate
        run: node ../trusted/tools/ci-run.mjs sql-server
      - name: Retain sql-server results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: test-results-sql-server-${{ github.run_id }}
          path: candidate/TestResults/**
          retention-days: 7

  browser:
    needs: plan
    if: ${{ !cancelled() && needs.plan.result == 'success' && (toJSON(fromJSON(needs.plan.outputs.plan).lanes.browser) != '[]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CI_PLAN: ${{ needs.plan.outputs.plan }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event_name == 'pull_request_target' && github.event.pull_request.base.sha || github.sha }}
          path: trusted
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ fromJSON(needs.plan.outputs.plan).source.merge }}
          path: candidate
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: candidate/global.json
      - name: Run planned browser work
        working-directory: candidate
        run: node ../trusted/tools/ci-run.mjs browser
      - name: Retain browser results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: test-results-browser-${{ github.run_id }}
          path: candidate/TestResults/**
          retention-days: 7

  operations:
    needs: plan
    if: ${{ !cancelled() && needs.plan.result == 'success' && (fromJSON(needs.plan.outputs.plan).operations) }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CI_PLAN: ${{ needs.plan.outputs.plan }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event_name == 'pull_request_target' && github.event.pull_request.base.sha || github.sha }}
          path: trusted
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ fromJSON(needs.plan.outputs.plan).source.merge }}
          path: candidate
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: candidate/global.json
      - name: Run planned operations work
        working-directory: candidate
        run: node ../trusted/tools/ci-run.mjs operations

  # Stable required status: only trusted code judges the complete planned union.
  build-and-test:
    needs: [plan, validation, home-assistant, sql-server, browser, operations]
    if: ${{ !cancelled() && needs.plan.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      CI_PLAN: ${{ needs.plan.outputs.plan }}
      CI_JOB_RESULTS: >-
        {"validation":"${{ needs.validation.result }}","home-assistant":"${{ needs.home-assistant.result }}","sql-server":"${{ needs.sql-server.result }}","browser":"${{ needs.browser.result }}","operations":"${{ needs.operations.result }}"}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event_name == 'pull_request_target' && github.event.pull_request.base.sha || github.sha }}
          path: trusted
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      - name: Verify every planned job and legitimate empty lane
        run: node trusted/tools/ci-run.mjs aggregate

  docker-smoke:
    needs: plan
    if: ${{ !cancelled() && needs.plan.result == 'success' && (true) }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CI_PLAN: ${{ needs.plan.outputs.plan }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event_name == 'pull_request_target' && github.event.pull_request.base.sha || github.sha }}
          path: trusted
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ fromJSON(needs.plan.outputs.plan).source.merge }}
          path: candidate
          persist-credentials: false
      - name: Run planned docker-smoke work
        working-directory: candidate
        run: node ../trusted/tools/ci-run.mjs docker-smoke
