name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '0 2 * * *'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: 1
      DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 1
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore HVO.WebSite.sln --nologo -v minimal

      - name: Build (Debug)
        run: dotnet build HVO.WebSite.sln --no-restore -c Debug --nologo -v minimal /p:ContinuousIntegrationBuild=true

      - name: Test (Unit)
        run: >
          dotnet test HVO.WebSite.sln --no-build -c Debug --nologo -v minimal
          --filter "TestCategory!=Integration"
          --logger "trx;LogFileName=tests.trx"
          --collect:"XPlat Code Coverage"
          --results-directory TestResults

      - name: Test (Integration - gated)
        if: |
          github.ref == 'refs/heads/main' || 
          github.event_name == 'schedule'
        run: >
          dotnet test HVO.WebSite.sln --no-build -c Debug --nologo -v minimal
          --filter "TestCategory=Integration"
          --logger "trx;LogFileName=tests-integration.trx"
          --collect:"XPlat Code Coverage"
          --results-directory TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-${{ github.run_id }}
          path: TestResults/**
          retention-days: 7
