name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '0 2 * * *'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: [self-hosted, Linux, X64, hvo-website]
    timeout-minutes: 25
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: 1
      DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 1
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore HVO.WebSite.sln --locked-mode --nologo -v minimal

      - name: Build (Debug)
        run: dotnet build HVO.WebSite.sln --no-restore -c Debug --nologo -v minimal /p:ContinuousIntegrationBuild=true

      - name: Install Playwright Chromium
        run: pwsh tests/HVO.WebSite.PlaywrightTests/bin/Debug/net10.0/playwright.ps1 install chromium

      - name: Test (Unit)
        shell: bash
        run: |
          test_args=(
            HVO.WebSite.sln --no-build -c Debug --nologo -v minimal
            --filter "TestCategory!=Integration&TestCategory!=Live"
            --logger "trx;LogFileName=tests.trx"
            --results-directory TestResults
          )
          if [[ "${{ github.event_name }}" != pull_request ]]; then
            test_args+=(--collect:"XPlat Code Coverage")
          fi
          dotnet test "${test_args[@]}"

      - name: Test (Integration)
        run: bash tools/run-home-assistant-integration-tests.sh

      - name: Validate test category conventions
        run: bash tools/validate-test-categories.sh

      - name: Validate observability policy
        run: |
          bash tools/validate-observability-policy.sh
          bash tools/validate-eg4-deployment.sh
          bash tools/verify-alert-rules.sh

      - name: Verify bounded logging and outage recovery
        run: |
          bash tools/verify-local-log-budget.sh
          bash tools/verify-log-outage-recovery.sh

      - name: Build (Release)
        run: dotnet build HVO.WebSite.sln --no-restore -c Release --nologo -v minimal /p:ContinuousIntegrationBuild=true

      - name: Publish script dry run
        run: bash tools/validate-publish-dry-run.sh

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-${{ github.run_id }}
          path: TestResults/**
          retention-days: 7

  docker-smoke:
    runs-on: [self-hosted, Linux, X64, hvo-website]
    timeout-minutes: 25
    env:
      DOCKER_SMOKE_CACHE_MODE: persistent
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Validate Docker smoke cleanup
        run: bash tools/verify-docker-build-smoke.sh

      - name: Docker build smoke
        run: bash tools/docker-build-smoke.sh
