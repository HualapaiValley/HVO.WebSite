name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
    types: [ready_for_review, synchronize, reopened]
  schedule:
    - cron: '0 2 * * *'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  review-evidence:
    if: github.event_name == 'pull_request' && !github.event.pull_request.draft
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      eligible: ${{ steps.evidence.outputs.eligible }}
    steps:
      # Read-only candidate gate also supports the first adoption PR. The separate
      # trusted metadata controller/status is live only after adoption on main.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - name: Validate current-source independent review
        id: evidence
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
          EXPECTED_BASE: ${{ github.event.pull_request.base.sha }}
        run: node tools/pr-process.mjs

  build-and-test:
    needs: review-evidence
    if: always() && (github.event_name != 'pull_request' || (!github.event.pull_request.draft && needs.review-evidence.result == 'success' && needs.review-evidence.outputs.eligible == 'true'))
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: 1
      DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore HVO.WebSite.sln --locked-mode --nologo -v minimal

      - name: Build (Debug)
        run: dotnet build HVO.WebSite.sln --no-restore -c Debug --nologo -v minimal /p:ContinuousIntegrationBuild=true

      - name: Install Playwright Chromium
        run: pwsh tests/HVO.WebSite.PlaywrightTests/bin/Debug/net10.0/playwright.ps1 install --with-deps chromium

      - name: Test (Unit)
        shell: bash
        run: |
          test_args=(
            HVO.WebSite.sln --no-build -c Debug --nologo -v minimal
            --filter "TestCategory!=Integration&TestCategory!=Live"
            --logger "trx;LogFileName=tests.trx"
            --results-directory TestResults
          )
          if [[ "${{ github.event_name }}" != pull_request ]]; then
            test_args+=(--collect:"XPlat Code Coverage")
          fi
          dotnet test "${test_args[@]}"

      - name: Test (Integration)
        run: bash tools/run-home-assistant-integration-tests.sh

      - name: Validate test category conventions
        run: bash tools/validate-test-categories.sh

      - name: Validate observability policy
        run: |
          bash tools/validate-observability-policy.sh
          bash tools/validate-davis-weather-underground-deployment.sh
          bash tools/validate-eg4-deployment.sh
          bash tools/validate-smartshunt-deployment.sh
          bash tools/verify-alert-rules.sh

      - name: Verify bounded logging and outage recovery
        run: |
          bash tools/verify-local-log-budget.sh
          bash tools/verify-log-outage-recovery.sh

      - name: Build (Release)
        run: dotnet build HVO.WebSite.sln --no-restore -c Release --nologo -v minimal /p:ContinuousIntegrationBuild=true

      - name: Publish script dry run
        run: bash tools/validate-publish-dry-run.sh

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: test-results-${{ github.run_id }}
          path: TestResults/**
          retention-days: 7

  docker-smoke:
    needs: review-evidence
    if: always() && (github.event_name != 'pull_request' || (!github.event.pull_request.draft && needs.review-evidence.result == 'success' && needs.review-evidence.outputs.eligible == 'true'))
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      DOCKER_SMOKE_CACHE_MODE: ephemeral
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Validate Docker smoke cleanup
        run: bash tools/verify-docker-build-smoke.sh

      - name: Docker build smoke
        run: bash tools/docker-build-smoke.sh
