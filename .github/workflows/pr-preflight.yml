name: PR Preflight

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, edited, ready_for_review, converted_to_draft]

permissions:
  contents: read
  pull-requests: read
  issues: read

concurrency:
  group: pr-preflight-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  simple-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - name: Check patch whitespace
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: git diff --check "$BASE_SHA...$HEAD_SHA"
      - name: Validate PR process helpers
        run: |
          # Ruby's stdlib YAML parser is used by the workflow syntax fixtures.
          if ! command -v ruby >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends ruby
          fi
          node --check tools/pr-process.mjs
          node --check tools/pr-process-control.mjs
          node --test tools/pr-process.test.mjs
          node --check tools/test-categories.mjs
          node --test tools/test-categories.test.mjs
      - name: Validate documentation navigation
        run: |
          python3 -m venv "$RUNNER_TEMP/hvo-docs-navigation"
          "$RUNNER_TEMP/hvo-docs-navigation/bin/python" -m pip install --disable-pip-version-check --require-hashes -r tools/docs-navigation-requirements.txt
          "$RUNNER_TEMP/hvo-docs-navigation/bin/python" -m unittest discover -s tools -p docs_navigation_test.py
          "$RUNNER_TEMP/hvo-docs-navigation/bin/python" tools/docs-navigation.py
      - name: Validate title, linked issue and author evidence
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: node tools/pr-process.mjs preflight
