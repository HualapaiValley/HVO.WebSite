name: Publish EG4 image
run-name: Publish EG4 ${{ inputs.version || github.ref_name }}

# Release publishing is explicit; PRs (including drafts) never build or publish here.
on:
  push:
    tags: ['eg4-v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'New semver image version (for example 1.0.0 or 1.0.0-rc.1)'
        type: string
        required: true

permissions:
  contents: read

# Serialize all EG4 publications, including manual/tag requests for the same version.
concurrency:
  group: publish-eg4
  cancel-in-progress: false

jobs:
  publish:
    # ARM64/pi5 is currently scoped to SkyMonitor. Use the eligible AMD runners
    # and QEMU until the owner separately grants WebSite native ARM access.
    runs-on: [self-hosted, Linux, X64, hvo-website, docker]
    timeout-minutes: 90
    env:
      DOCKER_HOST: unix:///var/run/docker.sock
      DOCKER_CONTEXT: default
      IMAGE: registry.hualapaivalleyobservatory.org/hvo-eg4
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - name: Admit release source and runner
        id: release
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          node tools/gateway-image.mjs eg4 version >> "$GITHUB_OUTPUT"
          # An owner-pushed prerelease tag can qualify this workflow before merge.
          # Stable releases and all manual dispatches must be contained in main.
          if [[ "$GITHUB_EVENT_NAME" != push || "$GITHUB_REF_NAME" != eg4-v*-* ]]; then
            git merge-base --is-ancestor "$GITHUB_SHA" origin/main
          fi
          case "$(hostname -s):$(docker info --format '{{.Name}}')" in
            *hvo-docker*|*home-docker*) echo 'Builds on deployment hosts are forbidden.' >&2; exit 1 ;;
          esac
          test "$(uname -m)" = x86_64
          config_directory="$RUNNER_TEMP/eg4-docker-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          install -d -m 700 "$config_directory"
          printf 'DOCKER_CONFIG=%s\n' "$config_directory" >> "$GITHUB_ENV"
          # Diagnostics only: no daemon, route, bridge or MTU mutation.
          ip -brief link
          docker network inspect bridge --format '{{json .Options}}'
      - name: Require credentials and an unused version
        env:
          HVO_CONTAINER_REGISTRY_USERNAME: ${{ secrets.HVO_CONTAINER_REGISTRY_USERNAME }}
          HVO_CONTAINER_REGISTRY_PASSWORD: ${{ secrets.HVO_CONTAINER_REGISTRY_PASSWORD }}
          VERSION: ${{ steps.release.outputs.version }}
        run: node tools/gateway-image.mjs eg4 available
      - name: Log in to the existing registry
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4
        with:
          registry: registry.hualapaivalleyobservatory.org
          username: ${{ secrets.HVO_CONTAINER_REGISTRY_USERNAME }}
          password: ${{ secrets.HVO_CONTAINER_REGISTRY_PASSWORD }}
      - name: Enable arm64 emulation
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4
        with:
          platforms: arm64
          image: tonistiigi/binfmt@sha256:400a4873b838d1b89194d982c45e5fb3cda4593fbfd7e08a02e76b03b21166f0
      - name: Set up Buildx
        uses: docker/setup-buildx-action@594f3bf4285d9ea8dc53c9a0c9c4092420091003 # v4.4.0
        with:
          version: v0.36.1
          driver-opts: image=moby/buildkit:v0.26.1@sha256:8290a3b1183f45fb0c7ccd2faa7aa88eeb9af0ea85ff54458cbd8cbdb576e721
      - name: Build and push both architectures
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: src/HVO.Hardware.Eg4/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.IMAGE }}:${{ steps.release.outputs.version }}
          labels: |
            org.opencontainers.image.version=${{ steps.release.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
          # Keep the registry index restricted to the two runnable platforms.
          provenance: false
          sbom: false
      - name: Verify registry manifest and record immutable handoff
        env:
          VERSION: ${{ steps.release.outputs.version }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          docker buildx imagetools inspect "$IMAGE@$DIGEST" --raw > "$RUNNER_TEMP/eg4-manifest.json"
          node tools/gateway-image.mjs eg4 manifest "$RUNNER_TEMP/eg4-manifest.json"
          # Verify that the version tag still resolves to that exact index.
          test "$(docker buildx imagetools inspect "$IMAGE:$VERSION" --format '{{.Manifest.Digest}}')" = "$DIGEST"
          # shellcheck disable=SC2016
          printf 'Source: `%s`\n\nImage: `%s:%s@%s`\n\nPlatforms: linux/amd64, linux/arm64\n\nNo deployment performed.\n' \
            "$GITHUB_SHA" "$IMAGE" "$VERSION" "$DIGEST" >> "$GITHUB_STEP_SUMMARY"
      - name: Remove temporary registry credentials
        if: always()
        run: rm -rf -- "$RUNNER_TEMP/eg4-docker-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
