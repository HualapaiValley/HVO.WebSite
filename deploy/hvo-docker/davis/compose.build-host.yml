# Historical build-only workaround for eth0 MTU 1450 / Docker bridge MTU 1500.
# The existing amd64 image is reused after the owner's Docker MTU repair.
# Build on hvo-docker only if that image is missing; see the adjacent runbook.
# This does not change the collector's runtime bridge network or Docker settings.
services:
  hvo-davis:
    build:
      network: host
