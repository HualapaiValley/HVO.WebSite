x-hvo-local-logging: &hvo-local-logging
  driver: local
  options:
    max-size: "10m"
    max-file: "3"
    compress: "true"
    mode: non-blocking
    max-buffer-size: "4m"

x-hvo-no-core: &hvo-no-core
  core:
    soft: 0
    hard: 0

services:
  hvo-website:
    build:
      context: ../..
      dockerfile: src/HVO.WebSite.v9/Dockerfile
    ports:
      - "80:8080"
    environment:
      ASPNETCORE_URLS: "${ASPNETCORE_URLS:-http://+:8080}"
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_FORWARDEDHEADERS_ENABLED: "true"
      EnableHttpsRedirect: "${EnableHttpsRedirect:-false}"
      HealthChecks__ExposeDetailed: "${HealthChecks__ExposeDetailed:-false}"
      ConnectionStrings__HualapaiValleyObservatory: "${ConnectionStrings__HualapaiValleyObservatory}"
      KeyVault__Uri: "${KeyVault__Uri:-https://hvo-central-kv.vault.azure.net/}"
      AZURE_CLIENT_ID: "${AZURE_CLIENT_ID}"
      AZURE_CLIENT_SECRET: "${AZURE_CLIENT_SECRET}"
      AZURE_TENANT_ID: "${AZURE_TENANT_ID}"
      Seeding__DavisApiKey: "${Seeding__DavisApiKey}"
      Seeding__WeatherReadApiKey: "${Seeding__WeatherReadApiKey}"
      Seeding__BmsApiKey: "${Seeding__BmsApiKey}"
      Seeding__PowerApiKey: "${Seeding__PowerApiKey}"
      Seeding__PowerReadApiKey: "${Seeding__PowerReadApiKey}"
      PowerStatus__Eg4InverterSourceId: "${PowerStatus__Eg4InverterSourceId:-eg4-6500ex-a}"
      PowerStatus__Eg4MpptSourceId: "${PowerStatus__Eg4MpptSourceId:-eg4-mppt100-48hv-a}"
      PowerStatus__HistoryHours: "${PowerStatus__HistoryHours:-6}"
      OTEL_SERVICE_NAME: hvo-website
      OTEL_EXPORTER_OTLP_ENDPOINT: "${OTEL_COLLECTOR_ENDPOINT:-}"
      OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
      DataProtection__ApplicationName: "${DataProtection__ApplicationName:-HVO.WebSite.v9}"
      DataProtection__KeysDirectory: "/root/.aspnet/DataProtection-Keys"
      DataProtection__KeyIdentifier: "${DataProtection__KeyIdentifier:-https://hvoobs-kv.vault.azure.net/keys/hvo-website-dp}"
      DataProtection__BlobUri: "${DataProtection__BlobUri:-}"
    volumes:
      - hvo-website-data-protection:/root/.aspnet/DataProtection-Keys
    networks:
      - website
      - mssql
    restart: unless-stopped
    logging: *hvo-local-logging
    ulimits: *hvo-no-core
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health/live"]
      interval: 30s
      timeout: 10s
      start_period: 15s
      retries: 3

networks:
  website:
    name: website_default
    external: true
  mssql:
    name: mssql_default
    external: true

volumes:
  hvo-website-data-protection:
    name: hvo-website-data-protection
