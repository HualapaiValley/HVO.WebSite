views:
  - title: Overview
    path: overview
    icon: mdi:home-lightning-bolt-outline
    type: sections
    max_columns: 3
    sections:
      - type: grid
        title: Live Power
        cards:
          - type: gauge
            entity: sensor.hvo_all_pv_power
            name: All Three PV Total
            min: 0
            max: 9000
            needle: true
          - type: gauge
            entity: sensor.hvo_3xhvo_3xeg4_13xinverter_x2da_34xparallel_x5ftotal_x5fload_x5fpower
            name: Parallel System Load
            min: 0
            max: 12000
            needle: true
          - type: gauge
            entity: sensor.hvo_3xhvo_10xsmartshunt_21xsmartshunt_x2dlifepo4_21xstate_x5fof_x5fcharge
            name: Whole-Bus Battery SOC
            min: 0
            max: 100
            needle: true
            severity:
              red: 0
              yellow: 20
              green: 50
      - type: grid
        title: Three PV Trackers
        cards:
          - type: tile
            entity: sensor.hvo_3xhvo_3xeg4_13xinverter_x2da_24xpv_x5fmppt_x5f1_x5fpower
            name: 6500EX MPPT 1
            icon: mdi:solar-panel
          - type: tile
            entity: sensor.hvo_3xhvo_3xeg4_13xinverter_x2da_24xpv_x5fmppt_x5f2_x5fpower
            name: 6500EX MPPT 2
            icon: mdi:solar-panel
          - type: tile
            entity: sensor.hvo_3xhvo_3xeg4_15xcontroller_x2da_24xpv_x5fmppt_x5f1_x5fpower
            name: Standalone MPPT100
            icon: mdi:solar-panel-large
          - type: tile
            entity: sensor.hvo_3xhvo_3xeg4_13xinverter_x2da_11xpv_x5fpower
            name: 6500EX Native Subtotal
            icon: mdi:solar-power
          - type: tile
            entity: sensor.hvo_all_pv_power
            name: All-Three Calculated Total
            icon: mdi:solar-power-variant
      - type: grid
        title: Today And Battery
        cards:
          - type: tile
            entity: sensor.hvo_6500ex_pv_energy_daily
            name: 6500EX Native PV Today
          - type: tile
            entity: sensor.hvo_external_mppt_pv_energy_daily
            name: MPPT100 Integrated PV Today
          - type: tile
            entity: sensor.hvo_total_pv_energy_daily
            name: Total PV Today
          - type: tile
            entity: sensor.hvo_3xhvo_10xsmartshunt_21xsmartshunt_x2dlifepo4_23xbattery_x5fnet_x5fpower
            name: Battery Net Power
          - type: tile
            entity: sensor.hvo_3xhvo_10xsmartshunt_21xsmartshunt_x2dlifepo4_18xbattery_x5fvoltage
            name: Battery Voltage
      - type: grid
        title: Reconciliation
        cards:
          - type: markdown
            content: >-
              **Live PV:** All-three total is the sum of 6500EX MPPT 1, 6500EX MPPT 2,
              and the standalone MPPT100 tracker. It becomes unavailable unless every
              source has a numeric value.

              **Daily PV:** Total PV Today adds the 6500EX native QET-derived daily meter
              to the standalone MPPT100 power-integration daily meter. No tracker or
              subtotal is counted twice. Native QET/QLT update about every five minutes,
              so short-lived differences are expected near updates and day boundaries.

  - title: Generation
    path: generation
    icon: mdi:solar-power
    type: sections
    max_columns: 2
    sections:
      - type: grid
        title: Generation Now
        cards:
          - type: gauge
            entity: sensor.hvo_3xhvo_3xeg4_13xinverter_x2da_24xpv_x5fmppt_x5f1_x5fpower
            name: 6500EX MPPT 1
            min: 0
            max: 4500
            needle: true
          - type: gauge
            entity: sensor.hvo_3xhvo_3xeg4_13xinverter_x2da_24xpv_x5fmppt_x5f2_x5fpower
            name: 6500EX MPPT 2
            min: 0
            max: 4500
            needle: true
          - type: gauge
            entity: sensor.hvo_3xhvo_3xeg4_15xcontroller_x2da_24xpv_x5fmppt_x5f1_x5fpower
            name: Standalone MPPT100
            min: 0
            max: 5000
            needle: true
          - type: gauge
            entity: sensor.hvo_all_pv_power
            name: All Three PV Total
            min: 0
            max: 9000
            needle: true
      - type: grid
        title: PV Power History
        cards:
          - type: statistics-graph
            title: PV Trackers - 24 Hours
            chart_type: line
            period: 5minute
            days_to_show: 1
            stat_types: [mean, max]
            entities:
              - sensor.hvo_3xhvo_3xeg4_13xinverter_x2da_24xpv_x5fmppt_x5f1_x5fpower
              - sensor.hvo_3xhvo_3xeg4_13xinverter_x2da_24xpv_x5fmppt_x5f2_x5fpower
              - sensor.hvo_3xhvo_3xeg4_15xcontroller_x2da_24xpv_x5fmppt_x5f1_x5fpower
              - sensor.hvo_all_pv_power
          - type: statistics-graph
            title: PV Totals - 7 Days
            chart_type: line
            period: hour
            days_to_show: 7
            stat_types: [mean, max]
            entities:
              - sensor.hvo_3xhvo_3xeg4_13xinverter_x2da_11xpv_x5fpower
              - sensor.hvo_all_pv_power
      - type: grid
        title: Daily Energy Reconciliation
        cards:
          - type: entities
            entities:
              - entity: sensor.hvo_6500ex_pv_energy_daily
                name: 6500EX Native QET-Derived Daily
              - entity: sensor.hvo_external_mppt_pv_energy_daily
                name: MPPT100 Integrated Daily
              - entity: sensor.hvo_total_pv_energy_daily
                name: Combined Daily, No Double Counting
          - type: statistics-graph
            title: Solar Energy - 14 Days
            chart_type: bar
            period: day
            days_to_show: 14
            stat_types: [change]
            entities:
              - sensor.hvo_3xhvo_3xeg4_13xinverter_x2da_21xpv_x5fenergy_x5ftotal
              - sensor.hvo_external_mppt_pv_energy

