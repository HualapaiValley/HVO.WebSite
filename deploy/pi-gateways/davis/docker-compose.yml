name: davis

x-hvo-local-logging: &hvo-local-logging
  driver: local
  options:
    max-size: "10m"
    max-file: "3"
    compress: "true"
    mode: non-blocking
    max-buffer-size: "4m"

services:
  hvo-davis:
    image: registry.hualapaivalleyobservatory.org/hvo-davis:${HVO_DAVIS_IMAGE_VERSION:?Set the published semver version}@${HVO_DAVIS_IMAGE_DIGEST:?Set the published multi-arch sha256 digest}
    ports:
      - "${DAVIS_HTTP_PORT:-5100}:8080"
    environment:
      Station__Host: ${DAVIS_STATION_HOST:?DAVIS_STATION_HOST is required}
      DOTNET_ENVIRONMENT: Production
      HVO_EDGE_RUNTIME_ENV_FILE: /app/config/runtime/.env
      OTEL_SERVICE_NAME: ${OTEL_SERVICE_NAME:-hvo-davis}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://192.168.1.238:4318}
      OTEL_EXPORTER_OTLP_PROTOCOL: ${OTEL_EXPORTER_OTLP_PROTOCOL:-http/protobuf}
    volumes:
      - "${DAVIS_REMOTE_CONFIG_FILE:?DAVIS_REMOTE_CONFIG_FILE is required}:/app/config/gateway.json:ro"
      - "${DAVIS_REMOTE_SECRETS_DIRECTORY:?DAVIS_REMOTE_SECRETS_DIRECTORY is required}:/run/secrets:ro"
      - type: bind
        source: ${DAVIS_REMOTE_RUNTIME_DIRECTORY:-/home/roys/.local/share/hvo-edge/davis/runtime}
        target: /app/config/runtime
        read_only: true
        bind:
          create_host_path: false
      - davis-outbox:/app/data
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      start_period: 90s
      retries: 3
    restart: unless-stopped
    logging: *hvo-local-logging
    ulimits:
      core:
        soft: 0
        hard: 0

volumes:
  davis-outbox:
