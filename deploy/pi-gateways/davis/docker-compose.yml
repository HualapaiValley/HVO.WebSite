name: davis

x-hvo-local-logging: &hvo-local-logging
  driver: local
  options:
    max-size: "10m"
    max-file: "3"
    compress: "true"
    mode: non-blocking
    max-buffer-size: "4m"

services:
  hvo-davis:
    build:
      context: ../../..
      dockerfile: src/HVO.Hardware.DavisVantagePro2/Dockerfile
    ports:
      - "${DAVIS_HTTP_PORT:-5100}:8080"
    environment:
      DOTNET_ENVIRONMENT: Production
      OTEL_SERVICE_NAME: hvo-davis
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_COLLECTOR_ENDPOINT:-}
      OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
    volumes:
      - "${DAVIS_CONFIG_FILE:-./gateway.json}:/app/config/gateway.json:ro"
      - "${DAVIS_SECRETS_DIRECTORY:-./secrets}:/run/secrets:ro"
      - davis-outbox:/app/data
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      start_period: 90s
      retries: 3
    restart: unless-stopped
    logging: *hvo-local-logging
    ulimits:
      core:
        soft: 0
        hard: 0

volumes:
  davis-outbox:
