name: eg4

x-hvo-local-logging: &hvo-local-logging
  driver: local
  options:
    max-size: "10m"
    max-file: "3"
    compress: "true"
    mode: non-blocking
    max-buffer-size: "4m"

x-hvo-no-core: &hvo-no-core
  core:
    soft: 0
    hard: 0

services:
  hvo-eg4:
    build:
      context: ../../..
      dockerfile: src/HVO.Hardware.Eg4/Dockerfile
    ports:
      - "${EG4_HTTP_PORT:-5600}:8080"
    devices:
      - "${EG4_DEVICE_0_PORT:-/dev/hvo/eg4-6500ex-a}:${EG4_DEVICE_0_PORT:-/dev/hvo/eg4-6500ex-a}:rw"
    environment:
      Eg4__SimulationEnabled: "false"
      Eg4__DefaultPollIntervalSeconds: ${EG4_DEFAULT_POLL_INTERVAL_SECONDS:-60}
      Eg4__Devices__0__Type: Inverter6500Ex
      Eg4__Devices__0__SourceId: ${EG4_DEVICE_0_SOURCE_ID:-eg4-6500ex-a}
      Eg4__Devices__0__DeviceId: ${EG4_DEVICE_0_DEVICE_ID:-inverter-a}
      Eg4__Devices__0__Alias: ${EG4_DEVICE_0_ALIAS:-6500EX Inverter A}
      Eg4__Devices__0__Enabled: ${EG4_DEVICE_0_ENABLED:-true}
      Eg4__Devices__0__Port: ${EG4_DEVICE_0_PORT:-/dev/hvo/eg4-6500ex-a}
      Eg4__Devices__0__UnitId: "0"
      Eg4__Devices__0__PollIntervalSeconds: ${EG4_DEVICE_0_POLL_INTERVAL_SECONDS:-60}
      Eg4__Devices__1__Type: ChargeControllerMppt10048Hv
      Eg4__Devices__1__SourceId: ${EG4_MPPT_0_SOURCE_ID:-eg4-mppt100-48hv-a}
      Eg4__Devices__1__DeviceId: ${EG4_MPPT_0_DEVICE_ID:-controller-a}
      Eg4__Devices__1__Alias: ${EG4_MPPT_0_ALIAS:-MPPT100-48HV Controller A}
      Eg4__Devices__1__Enabled: "false"
      Eg4__Devices__1__Port: ${EG4_MPPT_0_PORT:-/dev/serial/by-id/usb-1a86_USB_Serial-if00-port0}
      Eg4__Devices__1__UnitId: "1"
      Outbox__ApiEndpoint: "${HVO_WEBSITE_PUBLIC_BASE_URL:-https://www.hualapaivalleyobservatory.org}/api/v1/power/readings"
      Outbox__ApiKey: ${EG4_POWER_API_KEY:-}
      Outbox__DbPath: /app/data/outbox.db
      Outbox__MaxRetryAttempts: ${EG4_OUTBOX_MAX_RETRY_ATTEMPTS:-10}
      Outbox__MaxBackoffSeconds: ${EG4_OUTBOX_MAX_BACKOFF_SECONDS:-300}
      Outbox__SweepIntervalSeconds: ${EG4_OUTBOX_SWEEP_INTERVAL_SECONDS:-1}
      Outbox__BatchSize: ${EG4_OUTBOX_BATCH_SIZE:-500}
      Outbox__SentRetentionDays: ${EG4_OUTBOX_SENT_RETENTION_DAYS:-7}
      Outbox__FailedRetentionDays: ${EG4_OUTBOX_FAILED_RETENTION_DAYS:-30}
      Outbox__PendingWarningCount: ${EG4_OUTBOX_PENDING_WARNING_COUNT:-10}
      Outbox__FailedCriticalCount: ${EG4_OUTBOX_FAILED_CRITICAL_COUNT:-1}
      DOTNET_ENVIRONMENT: Production
      OTEL_SERVICE_NAME: hvo-eg4
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_COLLECTOR_ENDPOINT:-}
      OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
    volumes:
      - eg4-outbox:/app/data
      - eg4-data-protection:/root/.aspnet/DataProtection-Keys
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 3
    restart: unless-stopped
    logging: *hvo-local-logging
    ulimits: *hvo-no-core

volumes:
  eg4-outbox:
  eg4-data-protection:
