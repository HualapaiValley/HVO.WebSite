name: eg4

x-hvo-local-logging: &hvo-local-logging
  driver: local
  options:
    max-size: "10m"
    max-file: "3"
    compress: "true"
    mode: non-blocking
    max-buffer-size: "4m"

services:
  hvo-eg4:
    build:
      context: ../../..
      dockerfile: src/HVO.Hardware.Eg4/Dockerfile
    ports:
      - "${EG4_HTTP_PORT:-5600}:8080"
    devices:
      - "${EG4_DEVICE_0_PORT:-/dev/hvo/eg4-6500ex-a}:${EG4_DEVICE_0_PORT:-/dev/hvo/eg4-6500ex-a}:rw"
    environment:
      DOTNET_ENVIRONMENT: Production
      OTEL_SERVICE_NAME: hvo-eg4
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_COLLECTOR_ENDPOINT:-}
      OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
    volumes:
      - "${EG4_CONFIG_FILE:-./gateway.json}:/app/config/gateway.json:ro"
      - "${EG4_SECRETS_DIRECTORY:-./secrets}:/run/secrets:ro"
      - eg4-outbox:/app/data
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      start_period: 90s
      retries: 3
    restart: unless-stopped
    logging: *hvo-local-logging
    ulimits:
      core:
        soft: 0
        hard: 0

volumes:
  eg4-outbox:
