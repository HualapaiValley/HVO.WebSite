name: jkbms

x-hvo-local-logging: &hvo-local-logging
  driver: local
  options:
    max-size: "10m"
    max-file: "3"
    compress: "true"
    mode: non-blocking
    max-buffer-size: "4m"

services:
  hvo-jkbms:
    build:
      context: ../../..
      dockerfile: src/HVO.Hardware.JkBms/Dockerfile
    privileged: true
    ports:
      - "${JKBMS_HTTP_PORT:-5200}:8080"
    environment:
      DOTNET_ENVIRONMENT: Production
      OTEL_SERVICE_NAME: hvo-jkbms
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_COLLECTOR_ENDPOINT:-}
      OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
    volumes:
      - /run/dbus/system_bus_socket:/run/dbus/system_bus_socket
      - "${JKBMS_REMOTE_CONFIG_FILE:?JKBMS_REMOTE_CONFIG_FILE is required}:/app/config/gateway.json:ro"
      - "${JKBMS_REMOTE_SECRETS_DIRECTORY:?JKBMS_REMOTE_SECRETS_DIRECTORY is required}:/run/secrets:ro"
      - jkbms-outbox:/app/data
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health/live"]
      interval: 30s
      timeout: 10s
      start_period: 90s
      retries: 3
    restart: unless-stopped
    logging: *hvo-local-logging
    ulimits:
      core:
        soft: 0
        hard: 0

volumes:
  jkbms-outbox:
