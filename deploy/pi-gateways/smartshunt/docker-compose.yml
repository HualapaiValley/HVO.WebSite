name: smartshunt

x-hvo-local-logging: &hvo-local-logging
  driver: local
  options:
    max-size: "10m"
    max-file: "3"
    compress: "true"
    mode: non-blocking
    max-buffer-size: "4m"

services:
  hvo-smartshunt:
    image: registry.hualapaivalleyobservatory.org/hvo-smartshunt:${HVO_SMARTSHUNT_IMAGE_VERSION:?Set the published semver version}@${HVO_SMARTSHUNT_IMAGE_DIGEST:?Set the published multi-arch sha256 digest}
    privileged: true
    ports:
      - "${SMARTSHUNT_HTTP_PORT:-5400}:8080"
    environment:
      DOTNET_ENVIRONMENT: Production
      HVO_EDGE_RUNTIME_ENV_FILE: /app/config/runtime/.env
      OTEL_SERVICE_NAME: ${OTEL_SERVICE_NAME:-hvo-smartshunt}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://192.168.1.238:4318}
      OTEL_EXPORTER_OTLP_PROTOCOL: ${OTEL_EXPORTER_OTLP_PROTOCOL:-http/protobuf}
    volumes:
      - /run/dbus/system_bus_socket:/run/dbus/system_bus_socket
      - "${SMARTSHUNT_REMOTE_CONFIG_FILE:?SMARTSHUNT_REMOTE_CONFIG_FILE is required}:/app/config/gateway.json:ro"
      - "${SMARTSHUNT_REMOTE_SECRETS_DIRECTORY:?SMARTSHUNT_REMOTE_SECRETS_DIRECTORY is required}:/run/secrets:ro"
      - type: bind
        source: ${SMARTSHUNT_REMOTE_RUNTIME_DIRECTORY:-/home/roys/.local/share/hvo-edge/smartshunt/runtime}
        target: /app/config/runtime
        read_only: true
        bind:
          create_host_path: false
      - smartshunt-outbox:/app/data
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health/live"]
      interval: 30s
      timeout: 10s
      start_period: 90s
      retries: 3
    restart: unless-stopped
    logging: *hvo-local-logging
    ulimits:
      core:
        soft: 0
        hard: 0

volumes:
  smartshunt-outbox:
