# OTel Collector sidecar for hvo-jkbms
#
# Receives OTLP from the JkBms app (traces, metrics, logs) and also
# scrapes container-level metrics from the Docker daemon.
#
# Exports to both 'debug' (stdout) and 'azuremonitor' (App Insights).
# Connection string is injected via APPLICATIONINSIGHTS_CONNECTION_STRING env var.

receivers:
  # Receives OTLP from the hvo-jkbms app via HTTP/Protobuf.
  # The app posts to http://otel-collector-jkbms:4318.
  otlp:
    protocols:
      http:
        endpoint: 0.0.0.0:4318

  # Scrapes container-level metrics (CPU%, memory, network, block I/O)
  # from the Docker daemon for all containers on the host.
  docker_stats:
    endpoint: unix:///var/run/docker.sock
    collection_interval: 30s
    container_labels_as_resource_attributes: true

processors:
  # Prevent OOM if the downstream exporter is slow or offline.
  memory_limiter:
    limit_mib: 128
    spike_limit_mib: 32
    check_interval: 5s

  # Batch telemetry for efficient export.
  batch:
    timeout: 5s
    send_batch_size: 512

exporters:
  # Emit to stdout for pipeline visibility.
  debug:
    verbosity: normal

  # Send to Azure Application Insights.
  # Connection string is read from APPLICATIONINSIGHTS_CONNECTION_STRING env var.
  azuremonitor:
    connection_string: ${env:APPLICATIONINSIGHTS_CONNECTION_STRING}

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [debug, azuremonitor]
    metrics:
      receivers: [otlp, docker_stats]
      processors: [memory_limiter, batch]
      exporters: [debug, azuremonitor]
    logs:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [debug, azuremonitor]
