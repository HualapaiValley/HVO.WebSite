services:
  mosquitto:
    build:
      context: .
      dockerfile: mosquitto.Dockerfile
    ports:
      - "127.0.0.1::1883"
    healthcheck:
      test: ["CMD-SHELL", "mosquitto_sub -h 127.0.0.1 -t '$$SYS/broker/version' -C 1 -W 3 >/dev/null"]
      interval: 2s
      timeout: 4s
      retries: 20

  home-assistant:
    build:
      context: .
      dockerfile: home-assistant.Dockerfile
    depends_on:
      mosquitto:
        condition: service_healthy
    volumes:
      - ha-config:/config
      - ha-db:/data
    ports:
      - "127.0.0.1::8123"
    environment:
      TZ: UTC

  fake-ingest:
    build:
      context: .
      dockerfile: fake-ingest.Dockerfile
    command: ["--global-response-templating", "--verbose"]
    ports:
      - "127.0.0.1::8080"

volumes:
  ha-config:
  ha-db:
